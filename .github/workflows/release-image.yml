---
name: Release Image

# Publishes ghcr.io/ebbjs/ebb_server for a release tag (v0.1.0) or an
# explicit workflow_dispatch run. The PR/main build lives in ci.yml; this
# workflow is the only one allowed to move `latest`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Serialise publishes so two tag pushes cannot race over `latest`.
concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    # Same cold-build cost as ci.yml's Docker Image job, plus the push
    # and the pull-back smoke test.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # scripts/docker-smoke-test.sh drives
          # scripts/docker-persistence-check.mjs through node.
          node-version: "22"
      - uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: version
        env:
          # Empty on a tag push; the ref name is the source of truth there.
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${DISPATCH_VERSION:-}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a semantic version such as 0.1.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ebbjs/ebb_server
          # metadata-action stamps org.opencontainers.image.source,
          # .revision, .created and .version itself; only title/description
          # need spelling out.
          labels: |
            org.opencontainers.image.title=ebb_server
            org.opencontainers.image.description=Sync server for Ebb
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ebb_server/Dockerfile
          # Per-issue decision: amd64 only for the first release.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          # buildx attaches these to the pushed image itself; neither
          # needs OIDC or an external signer, so this workflow requests no
          # id-token/attestations permissions.
          provenance: true
          sbom: true
          # Separate scope from ci.yml so a tag build reuses its own
          # layers without fighting the PR cache for space.
          cache-from: type=gha,scope=release-ebb-server
          cache-to: type=gha,mode=max,scope=release-ebb-server

      # The tags are live before this step runs: the acceptance criterion
      # is that the *published* artifact is smoke-tested, not a local
      # build, so the smoke test pulls back the digest that was just
      # pushed.
      #
      # A smoke failure here therefore does not retract anything. Cleanup
      # is manual: delete the `<version>` package version in GHCR, fix the
      # cause, and re-run the workflow (or publish the next patch
      # version). CI cannot safely re-point `latest` on failure because
      # the previous digest is not retained on the runner.
      - name: Smoke test the published image
        env:
          PUBLISHED: ghcr.io/ebbjs/ebb_server@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$PUBLISHED"
          bash scripts/docker-smoke-test.sh "$PUBLISHED"
