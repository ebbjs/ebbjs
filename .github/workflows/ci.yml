---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # Elixir jobs
  # ─────────────────────────────────────────────────────────

  elixir-format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          # Pinned to match ebb_server/.tool-versions — see issue #62.
          elixir-version: "1.17.3"
          otp-version: "27"
      - name: Verify Elixir version matches .tool-versions
        run: |
          pinned=$(grep -E '^elixir ' ebb_server/.tool-versions | awk '{print $2}')
          installed=$(elixir --version | awk '/^Elixir /{print $2}')
          if [ "$pinned" != "$installed" ]; then
            echo "::error::Elixir version mismatch: pinned $pinned in ebb_server/.tool-versions, installed $installed."
            exit 1
          fi
          echo "Elixir $installed matches ebb_server/.tool-versions"
      - name: Install system dependencies
        run: sudo bash scripts/setup-ebb-server.sh
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            ebb_server/deps
            ebb_server/_build
            ~/.mix
            ~/.hex
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache rocksdb build
        uses: actions/cache@v4
        with:
          path: ebb_server/deps/rocksdb/_build
          key: rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}-${{ hashFiles('ebb_server/deps/rocksdb/rebar.config') }}
          restore-keys: |
            rocksdb-${{ runner.os }}-${{ runner.arch }}-
      - name: Fix CMake cache for architecture
        run: rm -f ebb_server/deps/rocksdb/_build/cmake/CMakeCache.txt
        working-directory: ebb_server
      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force
        working-directory: ebb_server
      - name: Install dependencies
        run: mix deps.get
        working-directory: ebb_server
      - name: Format Check
        run: mix format --check-formatted
        working-directory: ebb_server

  elixir-credo:
    name: Lint (Credo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          # Pinned to match ebb_server/.tool-versions — see issue #62.
          elixir-version: "1.17.3"
          otp-version: "27"
      - name: Verify Elixir version matches .tool-versions
        run: |
          pinned=$(grep -E '^elixir ' ebb_server/.tool-versions | awk '{print $2}')
          installed=$(elixir --version | awk '/^Elixir /{print $2}')
          if [ "$pinned" != "$installed" ]; then
            echo "::error::Elixir version mismatch: pinned $pinned in ebb_server/.tool-versions, installed $installed."
            exit 1
          fi
          echo "Elixir $installed matches ebb_server/.tool-versions"
      - name: Install system dependencies
        run: sudo bash scripts/setup-ebb-server.sh
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            ebb_server/deps
            ebb_server/_build
            ~/.mix
            ~/.hex
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache rocksdb build
        uses: actions/cache@v4
        with:
          path: ebb_server/deps/rocksdb/_build
          key: rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}-${{ hashFiles('ebb_server/deps/rocksdb/rebar.config') }}
          restore-keys: |
            rocksdb-${{ runner.os }}-${{ runner.arch }}-
      - name: Fix CMake cache for architecture
        run: rm -f ebb_server/deps/rocksdb/_build/cmake/CMakeCache.txt
        working-directory: ebb_server
      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force
        working-directory: ebb_server
      - name: Install dependencies
        run: mix deps.get
        working-directory: ebb_server
      - name: Lint (Credo)
        run: mix credo --strict --files-excluded "test/**"
        working-directory: ebb_server

  elixir-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          # Pinned to match ebb_server/.tool-versions — see issue #62.
          elixir-version: "1.17.3"
          otp-version: "27"
      - name: Verify Elixir version matches .tool-versions
        run: |
          pinned=$(grep -E '^elixir ' ebb_server/.tool-versions | awk '{print $2}')
          installed=$(elixir --version | awk '/^Elixir /{print $2}')
          if [ "$pinned" != "$installed" ]; then
            echo "::error::Elixir version mismatch: pinned $pinned in ebb_server/.tool-versions, installed $installed."
            exit 1
          fi
          echo "Elixir $installed matches ebb_server/.tool-versions"
      - name: Install system dependencies
        run: sudo bash scripts/setup-ebb-server.sh
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            ebb_server/deps
            ebb_server/_build
            ~/.mix
            ~/.hex
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache rocksdb build
        uses: actions/cache@v4
        with:
          path: ebb_server/deps/rocksdb/_build
          key: rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}-${{ hashFiles('ebb_server/deps/rocksdb/rebar.config') }}
          restore-keys: |
            rocksdb-${{ runner.os }}-${{ runner.arch }}-
      - name: Fix CMake cache for architecture
        run: rm -f ebb_server/deps/rocksdb/_build/cmake/CMakeCache.txt
        working-directory: ebb_server
      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force
        working-directory: ebb_server
      - name: Install dependencies
        run: mix deps.get
        working-directory: ebb_server
      - name: Test
        run: mix test
        working-directory: ebb_server

  # ─────────────────────────────────────────────────────────
  # Release builder — runs on every push/PR so typescript-test
  # always has a release available
  # ─────────────────────────────────────────────────────────

  elixir-release:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          # Pinned to match ebb_server/.tool-versions — see issue #62.
          elixir-version: "1.17.3"
          otp-version: "27"
      - name: Verify Elixir version matches .tool-versions
        run: |
          pinned=$(grep -E '^elixir ' ebb_server/.tool-versions | awk '{print $2}')
          installed=$(elixir --version | awk '/^Elixir /{print $2}')
          if [ "$pinned" != "$installed" ]; then
            echo "::error::Elixir version mismatch: pinned $pinned in ebb_server/.tool-versions, installed $installed."
            exit 1
          fi
          echo "Elixir $installed matches ebb_server/.tool-versions"
      - name: Install system dependencies
        run: sudo bash scripts/setup-ebb-server.sh
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            ebb_server/deps
            ebb_server/_build
            ~/.mix
            ~/.hex
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache rocksdb build
        uses: actions/cache@v4
        with:
          path: ebb_server/deps/rocksdb/_build
          key: rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}-${{ hashFiles('ebb_server/deps/rocksdb/rebar.config') }}
          restore-keys: |
            rocksdb-${{ runner.os }}-${{ runner.arch }}-
      - name: Fix CMake cache for architecture
        run: rm -f ebb_server/deps/rocksdb/_build/cmake/CMakeCache.txt
        working-directory: ebb_server
      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force
        working-directory: ebb_server
      - name: Install dependencies
        run: mix deps.get
        working-directory: ebb_server
      - name: Build and copy release
        run: bash packages/server/scripts/build-release.sh
      - name: Cache release artifact
        uses: actions/cache@v4
        with:
          path: packages/server/dist/ebb_server
          # Key on sources (not just mix.lock) so .ex changes
          # invalidate; no restore-keys so a stale release can't
          # sneak in via prefix match. v2- busts the pre-fix cache.
          key: v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock', 'ebb_server/config/*.exs', 'ebb_server/lib/**/*.ex') }}

  # ─────────────────────────────────────────────────────────
  # TypeScript jobs
  # ─────────────────────────────────────────────────────────

  typescript-typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit

  typescript-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typescript-format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check

  typescript-test:
    name: Test
    runs-on: ubuntu-latest
    needs: elixir-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Restore release artifact
        uses: actions/cache@v4
        with:
          path: packages/server/dist/ebb_server
          # Key must match elixir-release. v2- busts pre-fix cache.
          key: v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock', 'ebb_server/config/*.exs', 'ebb_server/lib/**/*.ex') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify packed artifacts
        run: pnpm verify:packages
      - run: pnpm --recursive exec vitest --run --passWithNoTests

  elixir-integration-tests:
    name: Integration Tests (client ↔ ebb_server)
    runs-on: ubuntu-latest
    needs: elixir-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install system dependencies
        run: sudo bash scripts/setup-ebb-server.sh
      - name: Restore release artifact
        uses: actions/cache@v4
        with:
          path: packages/server/dist/ebb_server
          # Key must match elixir-release. v2- busts pre-fix cache.
          key: v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock', 'ebb_server/config/*.exs', 'ebb_server/lib/**/*.ex') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start ebb_server
        env:
          EBB_AUTH_MODE: bypass
          EBB_DATA_DIR: /tmp/ebb-integration-data
        run: |
          mkdir -p "$EBB_DATA_DIR"
          rm -rf "$EBB_DATA_DIR"/*
          nohup ./packages/server/dist/ebb_server/bin/ebb_server start >/tmp/ebb_server.log 2>&1 &
          echo $! > /tmp/ebb_server.pid
          # Wait up to 60s for /sync/handshake to respond 2xx.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST http://localhost:4000/sync/handshake \
              -H 'Content-Type: application/json' \
              -H 'x-ebb-actor-id: ci_healthcheck' \
              -d '{}' || true)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ] 2>/dev/null; then
              echo "ebb_server ready (HTTP $code) after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ebb_server did not become ready within 60s"
          echo '--- last 100 lines of ebb_server.log ---'
          tail -n 100 /tmp/ebb_server.log
          exit 1
      - name: Run client integration tests
        # Runs every *.test.ts under src/__tests__/integration/.
        # presence.test.ts no-ops via itIfServerUp because it requires
        # a pre-seeded grp_demo group that this job does not bootstrap;
        # future self-seeding tests added to that directory will run
        # automatically.
        run: pnpm --filter @ebbjs/client test:integration
      - name: Run issue-tracker integration tests
        # Seeds the issue-tracker fixtures through the typed client and
        # asserts the typed namespaces against the same ebb_server; the
        # test short-circuits when the server is unreachable.
        run: pnpm --filter issue-tracker test:integration
      - name: Stop ebb_server
        if: always()
        run: |
          if [ -f /tmp/ebb_server.pid ]; then
            pid=$(cat /tmp/ebb_server.pid)
            # Kill the BEAM process and any children.
            pkill -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            # Give it a moment, then force-kill anything still bound to :4000.
            sleep 2
            pkill -f 'packages/server/dist/ebb_server/bin/ebb_server' 2>/dev/null || true
            rm -f /tmp/ebb_server.pid
          fi

  playwright-e2e:
    name: Playwright e2e (collaborative-text-demo)
    runs-on: ubuntu-latest
    needs: elixir-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Restore release artifact
        uses: actions/cache@v4
        with:
          path: packages/server/dist/ebb_server
          # Key must match elixir-release. v2- busts pre-fix cache.
          key: v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock', 'ebb_server/config/*.exs', 'ebb_server/lib/**/*.ex') }}
      - name: Install OS deps for Chromium
        run: sudo apt-get update && sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter collaborative-text-demo exec playwright install chromium
      - name: Run Playwright tests
        # The webServer entries in playwright.config.ts manage their
        # own lifecycle (start `ebb_server` + `pnpm dev`, wait for
        # readiness, stop on exit). One worker to avoid port-4000
        # collisions between parallel test files.
        run: pnpm --filter collaborative-text-demo test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: examples/collaborative-text-demo/playwright-report
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Container image — builds the same artifact a release tag
  # publishes and gates it on scripts/docker-smoke-test.sh.
  # The GHCR push is main-only and comes after the smoke test,
  # so a red PR never publishes an image.
  # ─────────────────────────────────────────────────────────

  docker-image:
    name: Docker Image
    runs-on: ubuntu-latest
    # The RocksDB NIF compiles from source inside the builder; ~20 min
    # cold, so leave room for a slow runner and the apt steps.
    timeout-minutes: 40
    permissions:
      contents: read
      # Needed by the main-branch push. Fork PRs get this downgraded to
      # read by GitHub, which is fine because PRs never push.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          # scripts/docker-smoke-test.sh drives
          # scripts/docker-persistence-check.mjs through node.
          node-version: "22"
      - name: Log in to GHCR
        # Only a push to main publishes, so only then do we authenticate.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ebb_server/Dockerfile
          platforms: linux/amd64
          # Loaded into the runner's daemon so the smoke test can run it;
          # publishing is a separate, main-only step below.
          load: true
          push: false
          tags: ebb_server:ci
          cache-from: type=gha,scope=ebb-server
          cache-to: type=gha,mode=max,scope=ebb-server
      - name: Smoke test image
        # The script is the single source of truth for the container
        # acceptance checks: runtime-image guardrails, size budget,
        # auth fail-fast, unauthenticated health, auth gate, write,
        # recreation against the same volume, read-back.
        run: bash scripts/docker-smoke-test.sh ebb_server:ci
      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LOCAL_IMAGE: ebb_server:ci
          REGISTRY_IMAGE: ghcr.io/ebbjs/ebb_server
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          docker tag "$LOCAL_IMAGE" "$REGISTRY_IMAGE:main"
          docker tag "$LOCAL_IMAGE" "$REGISTRY_IMAGE:sha-$sha"
          docker push "$REGISTRY_IMAGE:main"
          docker push "$REGISTRY_IMAGE:sha-$sha"
