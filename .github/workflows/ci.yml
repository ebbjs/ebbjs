---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # Elixir jobs
  # ─────────────────────────────────────────────────────────

  elixir-format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          # Pinned to match ebb_server/.tool-versions — see issue #62.
          elixir-version: "1.17.3"
          otp-version: "27"
      - name: Verify Elixir version matches .tool-versions
        run: |
          pinned=$(grep -E '^elixir ' ebb_server/.tool-versions | awk '{print $2}')
          installed=$(elixir --version | awk '/^Elixir /{print $2}')
          if [ "$pinned" != "$installed" ]; then
            echo "::error::Elixir version mismatch: pinned $pinned in ebb_server/.tool-versions, installed $installed."
            exit 1
          fi
          echo "Elixir $installed matches ebb_server/.tool-versions"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsnappy-dev libsqlite3-dev libz-dev libbz2-dev liblz4-dev libzstd-dev
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            ebb_server/deps
            ebb_server/_build
            ~/.mix
            ~/.hex
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache rocksdb build
        uses: actions/cache@v4
        with:
          path: ebb_server/deps/rocksdb/_build
          key: rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}-${{ hashFiles('ebb_server/deps/rocksdb/rebar.config') }}
          restore-keys: |
            rocksdb-${{ runner.os }}-${{ runner.arch }}-
      - name: Fix CMake cache for architecture
        run: rm -f ebb_server/deps/rocksdb/_build/cmake/CMakeCache.txt
        working-directory: ebb_server
      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force
        working-directory: ebb_server
      - name: Install dependencies
        run: mix deps.get
        working-directory: ebb_server
      - name: Format Check
        run: mix format --check-formatted
        working-directory: ebb_server

  elixir-credo:
    name: Lint (Credo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          # Pinned to match ebb_server/.tool-versions — see issue #62.
          elixir-version: "1.17.3"
          otp-version: "27"
      - name: Verify Elixir version matches .tool-versions
        run: |
          pinned=$(grep -E '^elixir ' ebb_server/.tool-versions | awk '{print $2}')
          installed=$(elixir --version | awk '/^Elixir /{print $2}')
          if [ "$pinned" != "$installed" ]; then
            echo "::error::Elixir version mismatch: pinned $pinned in ebb_server/.tool-versions, installed $installed."
            exit 1
          fi
          echo "Elixir $installed matches ebb_server/.tool-versions"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsnappy-dev libsqlite3-dev libz-dev libbz2-dev liblz4-dev libzstd-dev
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            ebb_server/deps
            ebb_server/_build
            ~/.mix
            ~/.hex
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache rocksdb build
        uses: actions/cache@v4
        with:
          path: ebb_server/deps/rocksdb/_build
          key: rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}-${{ hashFiles('ebb_server/deps/rocksdb/rebar.config') }}
          restore-keys: |
            rocksdb-${{ runner.os }}-${{ runner.arch }}-
      - name: Fix CMake cache for architecture
        run: rm -f ebb_server/deps/rocksdb/_build/cmake/CMakeCache.txt
        working-directory: ebb_server
      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force
        working-directory: ebb_server
      - name: Install dependencies
        run: mix deps.get
        working-directory: ebb_server
      - name: Lint (Credo)
        run: mix credo --strict --files-excluded "test/**"
        working-directory: ebb_server

  elixir-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          # Pinned to match ebb_server/.tool-versions — see issue #62.
          elixir-version: "1.17.3"
          otp-version: "27"
      - name: Verify Elixir version matches .tool-versions
        run: |
          pinned=$(grep -E '^elixir ' ebb_server/.tool-versions | awk '{print $2}')
          installed=$(elixir --version | awk '/^Elixir /{print $2}')
          if [ "$pinned" != "$installed" ]; then
            echo "::error::Elixir version mismatch: pinned $pinned in ebb_server/.tool-versions, installed $installed."
            exit 1
          fi
          echo "Elixir $installed matches ebb_server/.tool-versions"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsnappy-dev libsqlite3-dev libz-dev libbz2-dev liblz4-dev libzstd-dev
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            ebb_server/deps
            ebb_server/_build
            ~/.mix
            ~/.hex
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache rocksdb build
        uses: actions/cache@v4
        with:
          path: ebb_server/deps/rocksdb/_build
          key: rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}-${{ hashFiles('ebb_server/deps/rocksdb/rebar.config') }}
          restore-keys: |
            rocksdb-${{ runner.os }}-${{ runner.arch }}-
      - name: Fix CMake cache for architecture
        run: rm -f ebb_server/deps/rocksdb/_build/cmake/CMakeCache.txt
        working-directory: ebb_server
      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force
        working-directory: ebb_server
      - name: Install dependencies
        run: mix deps.get
        working-directory: ebb_server
      - name: Test
        run: mix test
        working-directory: ebb_server

  # ─────────────────────────────────────────────────────────
  # Release builder — runs on every push/PR so typescript-test
  # always has a release available
  # ─────────────────────────────────────────────────────────

  elixir-release:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          # Pinned to match ebb_server/.tool-versions — see issue #62.
          elixir-version: "1.17.3"
          otp-version: "27"
      - name: Verify Elixir version matches .tool-versions
        run: |
          pinned=$(grep -E '^elixir ' ebb_server/.tool-versions | awk '{print $2}')
          installed=$(elixir --version | awk '/^Elixir /{print $2}')
          if [ "$pinned" != "$installed" ]; then
            echo "::error::Elixir version mismatch: pinned $pinned in ebb_server/.tool-versions, installed $installed."
            exit 1
          fi
          echo "Elixir $installed matches ebb_server/.tool-versions"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsnappy-dev libsqlite3-dev libz-dev libbz2-dev liblz4-dev libzstd-dev
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            ebb_server/deps
            ebb_server/_build
            ~/.mix
            ~/.hex
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache rocksdb build
        uses: actions/cache@v4
        with:
          path: ebb_server/deps/rocksdb/_build
          key: rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock') }}-${{ hashFiles('ebb_server/deps/rocksdb/rebar.config') }}
          restore-keys: |
            rocksdb-${{ runner.os }}-${{ runner.arch }}-
      - name: Fix CMake cache for architecture
        run: rm -f ebb_server/deps/rocksdb/_build/cmake/CMakeCache.txt
        working-directory: ebb_server
      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force
        working-directory: ebb_server
      - name: Install dependencies
        run: mix deps.get
        working-directory: ebb_server
      - name: Build and copy release
        run: bash packages/server/scripts/build-release.sh
      - name: Cache release artifact
        uses: actions/cache@v4
        with:
          path: packages/server/dist/ebb_server
          # Cache key includes lib/config sources so any code change
          # invalidates the cache. Previously keyed only on mix.lock,
          # which silently served stale releases when only .ex source
          # files changed (see issue #86).
          #
          # No `restore-keys` fallback: a prefix match could serve a
          # stale release built from a different source snapshot under
          # an older key. We want a full rebuild whenever the key
          # changes.
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock', 'ebb_server/config/*.exs', 'ebb_server/lib/**/*.ex') }}

  # ─────────────────────────────────────────────────────────
  # TypeScript jobs
  # ─────────────────────────────────────────────────────────

  typescript-typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit

  typescript-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typescript-format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check

  typescript-test:
    name: Test
    runs-on: ubuntu-latest
    needs: elixir-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Restore release artifact
        uses: actions/cache@v4
        with:
          path: packages/server/dist/ebb_server
          # Must match the key in `elixir-release` (incl. lib/config
          # sources). No `restore-keys` — see elixir-release step for
          # the rationale. See #86.
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock', 'ebb_server/config/*.exs', 'ebb_server/lib/**/*.ex') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --recursive exec vitest --run --passWithNoTests

  elixir-integration-tests:
    name: Integration Tests (client ↔ ebb_server)
    runs-on: ubuntu-latest
    needs: elixir-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsnappy-dev libsqlite3-dev libz-dev libbz2-dev liblz4-dev libzstd-dev
      - name: Restore release artifact
        uses: actions/cache@v4
        with:
          path: packages/server/dist/ebb_server
          # Must match the key in `elixir-release` (incl. lib/config
          # sources). No `restore-keys` — see elixir-release step for
          # the rationale. See #86.
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ebb_server/mix.lock', 'ebb_server/config/*.exs', 'ebb_server/lib/**/*.ex') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start ebb_server
        env:
          EBB_DATA_DIR: /tmp/ebb-integration-data
        run: |
          mkdir -p "$EBB_DATA_DIR"
          rm -rf "$EBB_DATA_DIR"/*
          nohup ./packages/server/dist/ebb_server/bin/ebb_server start >/tmp/ebb_server.log 2>&1 &
          echo $! > /tmp/ebb_server.pid
          # Wait up to 60s for /sync/handshake to respond 2xx.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST http://localhost:4000/sync/handshake \
              -H 'Content-Type: application/json' \
              -H 'x-ebb-actor-id: ci_healthcheck' \
              -d '{}' || true)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ] 2>/dev/null; then
              echo "ebb_server ready (HTTP $code) after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ebb_server did not become ready within 60s"
          echo '--- last 100 lines of ebb_server.log ---'
          tail -n 100 /tmp/ebb_server.log
          exit 1
      - name: Run client integration tests
        # Runs every *.test.ts under src/__tests__/integration/.
        # presence.test.ts no-ops via itIfServerUp because it requires
        # a pre-seeded grp_demo group that this job does not bootstrap;
        # future self-seeding tests added to that directory will run
        # automatically.
        run: pnpm --filter @ebbjs/client test:integration
      - name: Stop ebb_server
        if: always()
        run: |
          if [ -f /tmp/ebb_server.pid ]; then
            pid=$(cat /tmp/ebb_server.pid)
            # Kill the BEAM process and any children.
            pkill -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            # Give it a moment, then force-kill anything still bound to :4000.
            sleep 2
            pkill -f 'packages/server/dist/ebb_server/bin/ebb_server' 2>/dev/null || true
            rm -f /tmp/ebb_server.pid
          fi
