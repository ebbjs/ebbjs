pre-commit:
  runner: bash
  commands:
    typescript-lint:
      glob: "**/*.{ts,tsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    typescript-fmt:
      glob: "**/*.{ts,tsx}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true
    elixir-format:
      root: ebb_server
      glob:
        - "ebb_server/lib/**"
        - "ebb_server/test/**"
        - "ebb_server/*.exs"
        - "ebb_server/.formatter.exs"
        - "ebb_server/config/*.exs"
      run: mix format --check-formatted
    elixir-credo:
      root: ebb_server
      glob:
        - "ebb_server/lib/**"
        - "ebb_server/test/**"
      run: mix credo --strict

pre-push:
  runner: bash
  commands:
    elixir-test:
      root: ebb_server
      glob:
        - "ebb_server/lib/**"
        - "ebb_server/test/**"
      run: mix test
