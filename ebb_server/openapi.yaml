                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable error details",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                    },
                                  "required": ["error"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "Invalid limit or cursor",
