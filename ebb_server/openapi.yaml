      "/functions/{name}/activate":
        {
          "post":
            {
              "description": "Makes one uploaded version the name's serving version in a single transaction: whatever was active is retired and the target becomes active. Requires the deploy credential in `Authorization: Bearer <admin token>`. The target's stored schemas are re-resolved first, so a row tampered with after upload cannot become active. Use `POST /functions/{name}/rollback` to return to the previous version.",
              "operationId": "activateFunction",
              "parameters":
                [
                  {
                    "description": "The function name",
                    "in": "path",
                    "name": "name",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "description": "`Bearer <admin token>` — the node's separate deploy credential. Missing, wrong, or unconfigured answers `403 denied`. It does not grant invoke permission.",
                    "in": "header",
                    "name": "Authorization",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "properties":
                                {
                                  "version":
                                    {
                                      "description": "The uploaded version to make active",
                                      "type": "string",
                                    },
                                },
                              "required": ["version"],
                              "type": "object",
                            },
                        },
                    },
                  "required": true,
                },
              "responses":
                {
                  "200":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "name": { "type": "string" },
                                      "ok": { "enum": [true], "type": "boolean" },
                                      "pinned":
                                        {
                                          "description": "Present on upload; whether retention will keep this version",
                                          "nullable": true,
                                          "type": "boolean",
                                        },
                                      "status":
                                        {
                                          "description": "The row's status after the write",
                                          "enum": ["active", "retired", "disabled"],
                                          "type": "string",
                                        },
                                      "version": { "type": "string" },
                                    },
                                  "required": ["ok", "name", "version", "status"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "The version is now active",
