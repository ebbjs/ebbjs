                {
                  "200":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "cursor":
                                        {
                                          "description": "Opaque cursor for the next page; null when has_more is false",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "entities":
                                        {
                                          "items":
                                            {
                                              "properties":
                                                {
