{
  "components":
    {
      "schemas":
        {
          "Action":
            {
              "properties":
                {
                  "actor_id": { "description": "Actor who created the action", "type": "string" },
                  "hlc":
                    {
                      "description": "Hybrid Logical Clock timestamp",
                      "format": "int64",
                      "type": "integer",
                    },
                  "id": { "description": "Unique action ID", "type": "string" },
                  "updates":
                    {
                      "items":
                        {
                          "properties":
                            {
                              "data":
                                {
                                  "description": "Update payload. Each field leaf's `hlc` must sit at most 120s ahead of the server clock",
                                  "nullable": true,
                                  "type": "object",
                                },
                              "id":
                                {
                                  "description": "Unique update ID within the action",
                                  "type": "string",
                                },
                              "method":
                                {
                                  "description": "Update method",
                                  "enum": ["put", "patch", "delete"],
                                  "type": "string",
                                },
                              "subject_id":
                                {
                                  "description": "ID of the entity being updated",
                                  "type": "string",
                                },
                              "subject_type":
                                {
                                  "description": "Type of the entity: the type an id nothing has committed yet is created under, and the type the entity was committed under for an existing id, which may not change",
                                  "type": "string",
                                },
                            },
                          "required": ["id", "subject_id", "subject_type", "method"],
                          "type": "object",
                        },
                      "type": "array",
                    },
                },
              "required": ["id", "actor_id", "hlc", "updates"],
              "type": "object",
            },
          "Entity":
            {
              "properties":
                {
                  "created_hlc": { "format": "int64", "type": "integer" },
                  "data":
                    {
                      "description": "Contains `fields` map of FieldValue entries",
                      "type": "object",
                    },
                  "deleted_hlc": { "format": "int64", "nullable": true, "type": "integer" },
                  "id": { "type": "string" },
                  "last_gsn": { "format": "int64", "type": "integer" },
                  "type": { "type": "string" },
                  "updated_hlc": { "format": "int64", "type": "integer" },
                },
              "required": ["id", "type", "data", "created_hlc", "updated_hlc", "last_gsn"],
              "type": "object",
            },
          "Error":
            {
              "properties":
                {
                  "details":
                    {
                      "description": "Human-readable error details",
                      "nullable": true,
                      "type": "string",
                    },
                  "error": { "description": "Error code string", "type": "string" },
                },
              "required": ["error"],
              "type": "object",
            },
          "GroupInfo":
            {
              "properties":
                {
                  "cursor": { "format": "int64", "type": "integer" },
                  "cursor_valid": { "type": "boolean" },
                  "id": { "description": "Group ID", "type": "string" },
                  "permissions": { "items": { "type": "string" }, "type": "array" },
                  "reason": { "nullable": true, "type": "string" },
                },
              "required": ["id", "permissions", "cursor_valid", "cursor"],
              "type": "object",
            },
          "Rejection":
            {
              "properties":
                {
                  "details": { "nullable": true, "type": "string" },
                  "id": { "description": "ID of the rejected action", "type": "string" },
                  "reason": { "description": "Rejection reason code", "type": "string" },
                },
              "required": ["id", "reason"],
              "type": "object",
            },
          "Update":
            {
              "properties":
                {
                  "data":
                    {
                      "description": "Update payload. Each field leaf's `hlc` must sit at most 120s ahead of the server clock",
                      "nullable": true,
                      "type": "object",
                    },
                  "id": { "description": "Unique update ID within the action", "type": "string" },
                  "method":
                    {
                      "description": "Update method",
                      "enum": ["put", "patch", "delete"],
                      "type": "string",
                    },
                  "subject_id":
                    { "description": "ID of the entity being updated", "type": "string" },
                  "subject_type":
                    {
                      "description": "Type of the entity: the type an id nothing has committed yet is created under, and the type the entity was committed under for an existing id, which may not change",
                      "type": "string",
                    },
                },
              "required": ["id", "subject_id", "subject_type", "method"],
              "type": "object",
            },
        },
    },
  "info":
    {
      "description": "A sync server for collaborative applications.",
      "title": "EbbServer Sync API",
      "version": "0.1.0",
    },
  "openapi": "3.1.0",
  "paths":
    {
      "/entities/query":
        {
          "post":
            {
              "description": "Returns a list of entities matching the given type, with optional field filtering and pagination. Results are ordered by creation HLC, then by entity ID, and each entity appears once.",
              "operationId": "queryEntities",
              "requestBody":
                {
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "properties":
                                {
                                  "filter":
                                    {
                                      "description": "Field-value filter: identifier-shaped keys mapped to JSON scalars (string, number, boolean or null), at most 64 keys",
                                      "maxProperties": 64,
                                      "nullable": true,
                                      "type": "object",
                                    },
                                  "limit":
                                    {
                                      "description": "Max results to return (1-1000, default 200)",
                                      "nullable": true,
                                      "type": "integer",
                                    },
                                  "offset":
                                    {
                                      "description": "Number of results to skip (a non-negative 64-bit integer)",
                                      "nullable": true,
                                      "type": "integer",
                                    },
                                  "type":
                                    { "description": "Entity type to query", "type": "string" },
                                },
                              "required": ["type"],
                              "type": "object",
                            },
                        },
                    },
                  "required": true,
                },
              "responses":
                {
                  "200":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "items":
                                    {
                                      "properties":
                                        {
                                          "created_hlc": { "format": "int64", "type": "integer" },
                                          "data":
                                            {
                                              "description": "Contains `fields` map of FieldValue entries",
                                              "type": "object",
                                            },
                                          "deleted_hlc":
                                            {
                                              "format": "int64",
                                              "nullable": true,
                                              "type": "integer",
                                            },
                                          "id": { "type": "string" },
                                          "last_gsn": { "format": "int64", "type": "integer" },
                                          "type": { "type": "string" },
                                          "updated_hlc": { "format": "int64", "type": "integer" },
                                        },
                                      "required":
                                        [
                                          "id",
                                          "type",
                                          "data",
                                          "created_hlc",
                                          "updated_hlc",
                                          "last_gsn",
                                        ],
                                      "type": "object",
                                    },
                                  "type": "array",
                                },
                            },
                        },
                      "description": "Matching entities",
                    },
                  "400":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable error details",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                    },
                                  "required": ["error"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "Request body could not be read by the adapter; error invalid_body",
                    },
                  "413":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable error details",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                    },
                                  "required": ["error"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "JSON body over `:entities_query_max_body_bytes` (default 1,048,576); error payload_too_large",
                    },
                  "422":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable error details",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                    },
                                  "required": ["error"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "Missing or invalid type, invalid JSON, a filter that is not identifier keys mapped to JSON scalars, or a limit/offset out of range",
                    },
                  "503":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable error details",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                    },
                                  "required": ["error"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "Query failed",
                    },
                },
              "summary": "Query entities by type",
              "tags": ["Entities"],
            },
        },
      "/entities/{id}":
        {
          "get":
            {
              "description": "Retrieves a single entity by its ID, materialized from the action log. Requires the actor to be a member of one of the entity's groups.",
              "operationId": "getEntity",
              "parameters":
                [
                  {
                    "description": "The entity ID",
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "created_hlc": { "format": "int64", "type": "integer" },
                                      "data":
                                        {
                                          "description": "Contains `fields` map of FieldValue entries",
                                          "type": "object",
                                        },
                                      "deleted_hlc":
                                        { "format": "int64", "nullable": true, "type": "integer" },
                                      "id": { "type": "string" },
                                      "last_gsn": { "format": "int64", "type": "integer" },
                                      "type": { "type": "string" },
                                      "updated_hlc": { "format": "int64", "type": "integer" },
                                    },
                                  "required":
                                    [
                                      "id",
                                      "type",
                                      "data",
                                      "created_hlc",
                                      "updated_hlc",
                                      "last_gsn",
                                    ],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "Entity found",
                    },
                  "401":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable error details",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                    },
                                  "required": ["error"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "Missing or invalid x-ebb-actor-id header",
                    },
                  "404":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable error details",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                    },
                                  "required": ["error"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "Entity not found, or the actor is not a member of any of its groups",
                    },
                  "503":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable error details",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                    },
                                  "required": ["error"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "Materialization failed",
                    },
                },
              "summary": "Read an entity by ID",
              "tags": ["Entities"],
            },
        },
      "/functions":
        {
          "get":
            {
              "description": "Returns one entry per function name that currently has an active version: its name, version, permission posture, and RPC schemas. Code is never returned. Any resolved actor may list; admin is only required to deploy or activate.",
              "operationId": "listFunctions",
              "responses":
                {
                  "200":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "functions":
                                        {
                                          "items":
                                            {
                                              "properties":
                                                {
                                                  "access":
                                                    {
                                                      "description": "`granted` needs a `function.<name>` or `function.*` permission; `authenticated` admits any resolved actor",
                                                      "enum": ["granted", "authenticated"],
                                                      "type": "string",
                                                    },
                                                  "name":
                                                    {
                                                      "description": "Function name",
                                                      "type": "string",
                                                    },
                                                  "outputSchema":
                                                    {
                                                      "description": "Stored draft-7 output JSON Schema; omitted when the bundle declared none",
                                                      "nullable": true,
                                                      "type": "object",
                                                    },
                                                  "paramsSchema":
                                                    {
                                                      "description": "Stored draft-7 params JSON Schema; omitted when the bundle declared none",
                                                      "nullable": true,
                                                      "type": "object",
                                                    },
                                                  "version":
                                                    {
                                                      "description": "Active version",
                                                      "type": "string",
                                                    },
                                                },
                                              "required": ["name", "version", "access"],
                                              "type": "object",
                                            },
                                          "type": "array",
                                        },
                                    },
                                  "required": ["functions"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "The active version of every deployed function",
                    },
                  "401":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable reason, never a stack",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                    },
                                  "required": ["error"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "No resolved actor",
                    },
                  "500":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable reason, never a stack",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                    },
                                  "required": ["error"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "The functions store could not be read",
                    },
                },
              "summary": "List deployed functions",
              "tags": ["Functions"],
            },
        },
      "/functions/{name}":
        {
          "post":
            {
              "description": 'Runs the function''s active version as the authenticated actor and returns its result. The actor needs a `function.<name>` (or `function.*`) grant unless the function declares `access: "authenticated"`; access is checked before the params schema, and both are checked before a worker runs. A result that fails the function''s output schema is `422 invalid_output` — committed writes stay committed. `invocation_id` and `version` travel in the body and the `x-ebb-invocation-id` / `x-ebb-function-version` headers. An `Idempotency-Key` request header makes a retry reuse the invocation id, so a repeated commit is answered as a replay (`"replayed": true`) instead of writing twice.',
              "operationId": "invokeFunction",
              "parameters":
                [
                  {
                    "description": "The function name",
                    "in": "path",
                    "name": "name",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "description": "Caller-chosen retry key, scoped to the actor and function. A retry with the same key reuses the invocation id, so the commit is deduped and answered as a replay. At most 255 bytes and never repeated.",
                    "in": "header",
                    "name": "Idempotency-Key",
                    "required": false,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "additionalProperties": true,
                              "description": "The function's params object, validated against its stored params schema before a worker runs. An empty body is `{}`.",
                              "type": "object",
                            },
                        },
                    },
                  "required": false,
                },
              "responses":
                {
                  "200":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "invocation_id": { "type": "string" },
                                      "ok": { "enum": [true], "type": "boolean" },
                                      "replayed":
                                        {
                                          "description": "Present only when the invocation committed; true means the Action was already durable or in flight, so no GSN was assigned to this caller",
                                          "nullable": true,
                                          "type": "boolean",
                                        },
                                      "result": { "description": "The handler's return value" },
                                      "version": { "type": "string" },
                                    },
                                  "required": ["ok", "result", "invocation_id", "version"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "The function returned successfully",
                      "headers":
                        {
                          "x-ebb-function-version":
                            {
                              "description": "The version that answered; absent when none was resolved",
                              "schema": { "type": "string" },
                            },
                          "x-ebb-invocation-id":
                            {
                              "description": "The invocation id, also present in the body",
                              "schema": { "type": "string" },
                            },
                        },
                    },
                  "400":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable reason, never a stack",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                      "invocation_id": { "type": "string" },
                                      "issues":
                                        {
                                          "description": "Present on `invalid_input` and `invalid_output`",
                                          "items":
                                            {
                                              "properties":
                                                {
                                                  "message": { "type": "string" },
                                                  "path":
                                                    {
                                                      "description": "Dotted path into the value, e.g. `items[0].name`",
                                                      "type": "string",
                                                    },
                                                },
                                              "required": ["path", "message"],
                                              "type": "object",
                                            },
                                          "type": "array",
                                        },
                                      "rejected":
                                        {
                                          "description": "Present when a commit was rejected",
                                          "items":
                                            {
                                              "properties":
                                                {
                                                  "details": { "nullable": true, "type": "string" },
                                                  "id":
                                                    {
                                                      "description": "ID of the rejected action",
                                                      "type": "string",
                                                    },
                                                  "reason":
                                                    {
                                                      "description": "Rejection reason code",
                                                      "type": "string",
                                                    },
                                                },
                                              "required": ["id", "reason"],
                                              "type": "object",
                                            },
                                          "type": "array",
                                        },
                                      "retryable":
                                        {
                                          "description": "True on 408, 429 and 503",
                                          "nullable": true,
                                          "type": "boolean",
                                        },
                                      "version":
                                        {
                                          "description": "The version that answered; absent when no active version was resolved",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                    },
                                  "required": ["error", "invocation_id"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "`invalid_input` with `issues`, or a malformed JSON body",
                      "headers":
                        {
                          "x-ebb-function-version":
                            {
                              "description": "The version that answered; absent when none was resolved",
                              "schema": { "type": "string" },
                            },
                          "x-ebb-invocation-id":
                            {
                              "description": "The invocation id, also present in the body",
                              "schema": { "type": "string" },
                            },
                        },
                    },
                  "401":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable reason, never a stack",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                      "error":
                                        { "description": "Error code string", "type": "string" },
                                      "invocation_id": { "type": "string" },
                                      "issues":
                                        {
                                          "description": "Present on `invalid_input` and `invalid_output`",
                                          "items":
                                            {
                                              "properties":
                                                {
                                                  "message": { "type": "string" },
                                                  "path":
                                                    {
                                                      "description": "Dotted path into the value, e.g. `items[0].name`",
                                                      "type": "string",
                                                    },
                                                },
                                              "required": ["path", "message"],
                                              "type": "object",
                                            },
                                          "type": "array",
                                        },
                                      "rejected":
                                        {
                                          "description": "Present when a commit was rejected",
                                          "items":
                                            {
                                              "properties":
                                                {
                                                  "details": { "nullable": true, "type": "string" },
                                                  "id":
                                                    {
                                                      "description": "ID of the rejected action",
                                                      "type": "string",
                                                    },
                                                  "reason":
                                                    {
                                                      "description": "Rejection reason code",
                                                      "type": "string",
                                                    },
                                                },
                                              "required": ["id", "reason"],
                                              "type": "object",
                                            },
                                          "type": "array",
                                        },
                                      "retryable":
                                        {
                                          "description": "True on 408, 429 and 503",
                                          "nullable": true,
                                          "type": "boolean",
                                        },
                                      "version":
                                        {
                                          "description": "The version that answered; absent when no active version was resolved",
                                          "nullable": true,
                                          "type": "string",
                                        },
                                    },
                                  "required": ["error", "invocation_id"],
                                  "type": "object",
                                },
                            },
                        },
                      "description": "Unauthenticated",
                      "headers":
                        {
                          "x-ebb-function-version":
                            {
                              "description": "The version that answered; absent when none was resolved",
                              "schema": { "type": "string" },
                            },
                          "x-ebb-invocation-id":
                            {
                              "description": "The invocation id, also present in the body",
                              "schema": { "type": "string" },
                            },
                        },
                    },
                  "403":
                    {
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "properties":
                                    {
                                      "details":
                                        {
                                          "description": "Human-readable reason, never a stack",
                                          "nullable": true,
                                          "type": "string",
                                        },
