                [
                  {
                    "description": "The group ID to list",
                    "in": "path",
                    "name": "group_id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "description": "Opaque cursor from the previous page (omit for the first page)",
                    "in": "query",
                    "name": "cursor",
