          "get":
            {
              "description": "Returns one page of the group's state at a resolution frontier: the group row, its live groupMember rows, every live entityGroup row in the group, and the live entities those rows name. Page with `cursor` until `has_more` is false, then tail the group from `watermark`. Entity objects are identical in shape to `GET /entities/{id}`.",
